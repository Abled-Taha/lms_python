<div id="active-loans-container" 
     hx-get="{% url 'active_loans_partial' %}" 
     hx-trigger="refresh-book-list from:body"
     hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    
    <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 shadow-sm">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Book</th>
                    <th class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Borrower</th>
                    <th class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Deposit</th>
                    <th class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                {% for loan in loans %}
                <tr id="loan-{{ loan.id }}" class="hover:bg-slate-50/50 transition">
                    <td class="p-3 text-sm font-medium text-slate-900">{{ loan.book.title }}</td>
                    <td class="p-3 text-sm text-slate-600">{{ loan.borrower_name }}</td>
                    <td class="p-3 text-sm font-mono text-emerald-600">Rs. {{ loan.deposit_amount }}</td>
                    <td class="p-3">
                        <button hx-get="{% url 'return_book_form' loan.id %}"
                                hx-target="#modal-body"
                                class="bg-slate-100 text-slate-700 text-xs px-2 py-1 rounded hover:bg-slate-200 transition">
                            Return
                        </button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="p-6 text-center text-sm text-slate-400 italic">No active loans.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
